<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendy Oxford School Backpack</title>
    <!-- Link to your external CSS file -->
</head>
<style>
        /* Container styling */
        variant-inventory {
            display: block;
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 300px;
        }

        /* Success green text color */
        .text-success {
            color: #2e7d32;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Progress Bar wrapper custom element */
        progress-bar {
            display: block;
            background-color: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
        }

        /* The actual colored filler inside the bar */
        progress-bar::after {
            content: '';
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background-color: #4caf50;
            border-radius: 4px;
            
            /* Uses the CSS variable from the inline style, defaults to 0% width */
            width: calc(var(--progress, 0) * 100%);
            
            /* Animation setup */
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 1s cubic-bezier(0.1, 1, 0.1, 1);
        }

        /* Class added by JavaScript when the element is scrolled into view */
        progress-bar.is-animated::after {
            transform: scaleX(1);
        }

        /* Dummy spacer just to force scrolling so you can test the trigger */
        .spacer {
            height: 100vh;
            display: flex;
            align-items: center;
            color: #888;
            font-style: italic;
        }

    /* Overall Layout Wrapper */
.product-gallery {
    max-width: 400px;
    margin: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* Aligns both the big image and row to the left side */
}

/* Big Image Styling */
.main-image-display img {
    width: 430px;
    height: auto;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
}

/* Row Layout for Thumbnail Buttons */
.thumbnail-container {
    display: flex;
    flex-direction: row;        /* Forces them into a row shape */
    justify-content: flex-start; /* Groups them closely at the left side */
    gap: 19px;                  /* Clean spaces between buttons */
    margin-top: 15px;
}

/* Individual Small Image Buttons */
.thumb-btn {
    width: 75px;
    height: 75px;
    padding: 0;
    background: none;
    border: 2px solid transparent; /* Hidden border until active */
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;             /* Keeps the image tucked inside the rounded corners */
    box-shadow: 0px 6px 12px rgba(7, 9, 15, 0.25);
    transition: transform 0.2s ease, border-color 0.2s ease;
}

/* Hover Zoom Effect */
.thumb-btn:hover {
    transform: scale(1.04);
}

/* Highlight Selected Button Style */
.thumb-btn.active {
    border-color: #07090f; /* Dark border outlines the active thumbnail */
}

/* Forces the image inside the button to stretch beautifully without distortion */
.thumb-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

 /* review stars css start */
.review-preview-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s ease;
        }

        .review-preview-badge:hover {
            opacity: 0.8;
            color: #555555;
        }

        /* The Stars Wrapper System */
        .review-stars-container {
            position: relative;
            font-size: 1.3rem;
            line-height: 1;
            display: inline-block;
            letter-spacing: 2px;
        }

        /* Base layer: 5 Gray Empty Stars */
        .stars-empty {
            color: #e0e0e0;
            /* border: black 1px solid; */
        }

        /* Top layer: Golden Filled Stars */
        .stars-filled {
            color: #ffb300;
            position: absolute;
            top: 0;
            left: 0;
            white-space: nowrap;
            overflow: hidden;
            
            /* Initial fallback width, dynamically updated by JavaScript */
            width: 0%; 
            transition: width 0.3s ease-in-out;
        }

        /* Text Label styling */
        .review-text {
            color: #555555;
            font-size: 0.9rem;
            font-weight: 500;
        }
        /* review-star css end */
</style>
<body>

    <section class="product-gallery">
         <!-- 1. THE BIG MAIN DISPLAY IMAGE -->
        <div class="main-image-display">
            <img id="main-product-image" src="main.webp" alt="Front view of the backpack">
        </div>

          <!-- 2. THE THUMBNAILS (Arranged in a row at the left side) -->
        <div class="thumbnail-container">
            
            <!-- Thumbnail 1 (Active/Selected by default) -->
            <button type="button" class="thumb-btn active" data-large-image="main.webp" aria-label="View front view">
                <img src="main.webp"Front view">
            </button>

            <!-- Thumbnail 2 -->
            <button type="button" class="thumb-btn" data-large-image="side.webp" aria-label="View side view">
                <img src="side.webp" alt="Side view">
            </button>

            <!-- Thumbnail 3 -->
            <button type="button" class="thumb-btn" data-large-image="back.webp" aria-label="View inside view">
                <img src="back.webp" alt="Inside compartments view">
            </button>

            <!-- Thumbnail 4 -->
            <button type="button" class="thumb-btn" data-large-image="buttom.webp" aria-label="View back view">
                <img src="buttom.webp" alt="Back view of backpack">
            </button>

        </div>

        
    </section>>
        
       
      
    </div>
     <!-- The Product Inventory Component -->
    <variant-inventory class="inventory text-success">
        <span>In stock</span>
        <progress-bar 
            class="progress-bar" 
            animate-on-scroll 
            aria-valuenow="45" 
            aria-valuemax="50" 
            style="--progress: 0.9;">
        </progress-bar>
    </variant-inventory>

    <div style="display: flex; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;"><h1>Men's Waterproof Trendy Nylon Commuting Backpack</h1></div>

    <!-- 
      DEVELOPER NOTE: Change the data-rating (0 to 5) and data-reviews 
      attributes below to whatever values you need. 
    -->
    <div class="review-preview-badge" 
         id="my-review-badge"
         role="button" 
         tabindex="0" 
         data-rating="4.5" 
         data-reviews="28">
        
        <div class="review-stars-container">
            <!-- 5 Empty stars in background -->
            <div class="stars-empty">★★★★★</div>
            <!-- 5 Filled stars that get clipped horizontally -->
            <div class="stars-filled">★★★★★</div>
        </div>

        <!-- The text element filled by JavaScript -->
        <span class="review-text">Loading reviews...</span>
    </div>


    <!-- Link to your external JavaScript file -->
    <script>
         // <!-- JavaScript for review stars -->
        function updateReviewBadge(badgeId) {
            const badge = document.getElementById(badgeId);
            if (!badge) return;

            // 1. Pull values from our custom data attributes
            const rating = parseFloat(badge.getAttribute('data-rating')) || 0;
            const reviews = parseInt(badge.getAttribute('data-reviews')) || 0;

            // 2. Clamp the rating safely between 0 and 5
            const safelyClampedRating = Math.min(Math.max(rating, 0), 5);

            // 3. Convert score to a percentage (e.g., 4.5 out of 5 = 90%)
            const fillPercentage = (safelyClampedRating / 5) * 100;

            // 4. Update the width of the filled stars layer
            const filledStarsLayer = badge.querySelector('.stars-filled');
            if (filledStarsLayer) {
                filledStarsLayer.style.width = `${fillPercentage}%`;
            }

            // 5. Update the readable counter text
            const textLabel = badge.querySelector('.review-text');
            if (textLabel) {
                textLabel.textContent = `${reviews} review${reviews === 1 ? '' : 's'}`;
            }

            // 6. Update Accessibility labels for screen readers
            badge.setAttribute('aria-label', `${safelyClampedRating.toFixed(2)} out of 5 stars based on ${reviews} reviews`);
        }

        // Initialize your badge layout on page load
        document.addEventListener("DOMContentLoaded", () => {
            updateReviewBadge('my-review-badge');
        });
         // <!-- JavaScript for review stars  end-->

        document.addEventListener("DOMContentLoaded", () => {
            // 1. ANIMATE ON SCROLL LOGIC
            // Using IntersectionObserver is the cleanest way to detect when items are on screen
            const observerOptions = {
                root: null, // uses viewport
                threshold: 0.2 // triggers when 20% of the element is visible
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Add the CSS class that triggers the transition slide-in
                        entry.target.classList.add('is-animated');
                        // Stop watching once it has animated
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            // Find all progress bars marked with 'animate-on-scroll'
            const animatedBars = document.querySelectorAll('progress-bar[animate-on-scroll]');
            animatedBars.forEach(bar => observer.observe(bar));


            // 2. SELF-HEALING ARIA ACCESSIBILITY FIX (Bonus)
            // If developer inputs bad math, let JS mathematically clamp the values dynamically
            animatedBars.forEach(bar => {
                const now = parseFloat(bar.getAttribute('aria-valuenow'));
                const max = parseFloat(bar.getAttribute('aria-valuemax'));
                
                if (now > max) {
                    console.warn("Fixing glitch: aria-valuenow was greater than aria-valuemax.");
                    bar.setAttribute('aria-valuenow', max); // Set current to max out at 100%
                }
            });
        });
        // 1. Select the major interactive objects on our screen
const mainImage = document.getElementById('main-product-image');
const allThumbnails = document.querySelectorAll('.thumb-btn');

// 2. Add an event processor for each thumbnail loop
allThumbnails.forEach(thumbnail => {
  
  // 3. Listen for clicks on individual thumbnails
  thumbnail.addEventListener('click', function() {
    
    // 4. Pull the target data-large-image link string
    const newImageSource = this.getAttribute('data-large-image');
    
    // 5. Look inside the button to read its alt description text
    const smallImage = this.querySelector('img');
    const newAltText = smallImage.getAttribute('alt');
    
    // 6. SWAP: Push the source and alt texts to the primary main layout image
    mainImage.setAttribute('src', newImageSource);
    mainImage.setAttribute('alt', newAltText);
    
    // 7. HIGHLIGHT CONTEXT: Strip active classes elsewhere and assign to 'this' clicked one
    allThumbnails.forEach(btn => btn.classList.remove('active'));
    this.classList.add('active');
    
  });
});
    </script>
</body>
</html>
